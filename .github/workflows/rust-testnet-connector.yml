name: Verify Rust testnet connector
on:
  push:
    branches: [rust-testnet-connector]
    paths:
      - 'connectors/hyperliquid-testnet/**'
      - '.github/workflows/rust-testnet-connector.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: connectors/hyperliquid-testnet
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build optimized Rust connector
        run: |
          rustc --version
          cargo --version
          test -f Cargo.lock || cargo generate-lockfile
          cargo build --release --locked
      - name: Test connector with local fixtures
        run: cargo test --release --locked
      - name: Read public BTC HTTP book
        run: ./target/release/hyperliquid-testnet connect
      - name: Compare public BTC feeds at the same decision times
        run: |
          for window in first second; do
            python3 bench/decision_age.py capture ./target/release/hyperliquid-testnet "$RUNNER_TEMP/btc-testnet-quotes" "$window"
          done
          cp Cargo.lock "$RUNNER_TEMP/btc-testnet-quotes/Cargo.lock"
      - name: Save timestamped observations and summaries
        uses: actions/upload-artifact@v4
        with:
          name: btc-testnet-latency
          path: ${{ runner.temp }}/btc-testnet-quotes
          retention-days: 7

name: Verify Rust testnet connector
on:
  push:
    branches: [rust-testnet-connector]
    paths:
      - 'connectors/hyperliquid-testnet/**'
      - '.github/workflows/rust-testnet-connector.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: connectors/hyperliquid-testnet
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build connector
        run: |
          rustc --version
          cargo --version
          test -f Cargo.lock || cargo generate-lockfile
          cargo build --locked
      - name: Test connector with local fixtures
        run: cargo test --locked
      - name: Read public BTC HTTP book
        run: ./target/debug/hyperliquid-testnet connect
      - name: Check public WebSocket feed capabilities
        run: cargo run --locked --example feed_capabilities
      - name: Compare BTC top of book at shared decision times
        run: |
          capture() {
            local file="$1"
            shift
            timeout 75s ./target/debug/hyperliquid-testnet stream "$@" > "$file" && return 1
            local status=$?
            test "$status" -eq 124
          }
          capture "$RUNNER_TEMP/l2.jsonl" &
          l2_pid=$!
          capture "$RUNNER_TEMP/top.jsonl" --bbo &
          top_pid=$!
          wait "$l2_pid"
          wait "$top_pid"
          python3 bench/decision_age.py "$RUNNER_TEMP/l2.jsonl" "$RUNNER_TEMP/top.jsonl"
